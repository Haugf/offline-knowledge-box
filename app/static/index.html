<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe8d8">
<title>Offline Knowledge Box</title>
<style>
  :root {
    --mint: #dcefe2; --mint-deep: #b9dcc6; --forest: #1f4d3a; --ink: #18281f;
    --muted: #4f6b5c; --paper: #f4faf5; --line: #8fbfa2; --accent: #2f7a55;
  }
  @media (prefers-color-scheme: dark) {
    :root { --mint: #18291f; --mint-deep: #22392c; --forest: #a9d9bd; --ink: #e3f2e8;
            --muted: #9dbca9; --paper: #101c15; --line: #3c6b50; --accent: #7fcaa0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.55 ui-sans-serif, system-ui, sans-serif;
    background-color: var(--paper);
    /* topo-map contour texture */
    background-image:
      repeating-radial-gradient(circle at 20% 10%, transparent 0 22px, var(--mint-deep) 22px 23px),
      repeating-radial-gradient(circle at 85% 80%, transparent 0 28px, var(--mint-deep) 28px 29px);
    background-blend-mode: multiply;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 120px; }
  header { border: 2px solid var(--forest); background: var(--mint); padding: 14px 16px; border-radius: 6px; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--forest); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; margin-top: 8px; padding: 2px 8px; border: 1px solid var(--forest);
           border-radius: 999px; font-size: 12px; color: var(--forest); }
  #log { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .q { align-self: flex-end; background: var(--forest); color: var(--paper); padding: 10px 14px;
       border-radius: 14px 14px 2px 14px; max-width: 85%; }
  .a { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .meta a { color: var(--accent); }
  form { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         background: var(--mint); border-top: 2px solid var(--forest); }
  .row { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--paper); color: var(--ink); }
  button { font: inherit; padding: 0 18px; border: 0; border-radius: 6px; background: var(--forest); color: var(--paper); }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Offline Knowledge Box</h1>
    <p>Open-weight model + local knowledge pack. No network required.</p>
    <span class="badge" id="status">Checking…</span>
  </header>
  <div id="log"></div>
  <p class="meta" style="margin-top:24px">Knowledge from <a href="https://www.wikipedia.org">Wikipedia</a>, licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Open-weight model via Ollama. Not medical or emergency advice.</p>
</main>
<form id="f">
  <div class="row">
    <input id="q" placeholder="Ask anything — works in airplane mode" autocomplete="off" required>
    <button id="go">Ask</button>
  </div>
</form>
<script>
const log = document.getElementById('log');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/api/status').then(r => r.json()).then(s => {
  const pack = s.chunks ? `${s.chunks.toLocaleString()} chunks` : 'no knowledge pack';
  document.getElementById('status').textContent = `${s.default_model.split('/').pop()} · ${pack}`;
}).catch(() => document.getElementById('status').textContent = 'API unreachable');

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('q'), btn = document.getElementById('go');
  const question = input.value.trim(); if (!question) return;
  log.insertAdjacentHTML('beforeend', `<div class="q">${esc(question)}</div>`);
  const a = document.createElement('div'); a.className = 'a'; a.textContent = 'Thinking…'; log.append(a);
  input.value = ''; btn.disabled = true; a.scrollIntoView({behavior: 'smooth'});
  try {
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({question})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    const src = d.sources.map(s => s.url ? `<a href="${esc(s.url)}">[${s.n}] ${esc(s.title)}</a>` : `[${s.n}] ${esc(s.title)}`).join(' · ');
    a.innerHTML = `${esc(d.answer)}<div class="meta">${src}<br>${esc(d.model.split('/').pop())} · ${d.tokens_per_sec} tok/s</div>`;
  } catch (err) { a.textContent = 'Error: ' + err.message; }
  btn.disabled = false;
});
</script>
</body>
</html>
