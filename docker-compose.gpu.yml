# GPU tier — NVIDIA card on Windows (Docker Desktop + WSL2) or Linux with nvidia-container-toolkit.
# Verify first:  docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
