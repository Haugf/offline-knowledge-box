<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Offline Knowledge Box architecture">
  <title>Offline Knowledge Box architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1F4D3A"/>
    </marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#E58A2E"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>

  <text x="30" y="38" font-size="20" font-weight="700" fill="#1F4D3A">Online once to set up, then fully offline</text>

  <!-- Hugging Face Hub (online, one time) -->
  <rect x="30" y="64" width="840" height="78" rx="10" fill="#FFF4E8" stroke="#E58A2E" stroke-dasharray="6 5"/>
  <text x="50" y="92" font-size="15" font-weight="700" fill="#8A4A0E">Hugging Face Hub · online, one time</text>
  <text x="50" y="118" font-size="13" fill="#5C3A12">open-weight GGUF model · embedding model · Wikipedia dataset</text>
  <text x="850" y="118" font-size="13" fill="#5C3A12" text-anchor="end">benchmark results published back ↑</text>

  <!-- The box -->
  <rect x="230" y="176" width="640" height="264" rx="12" fill="#E4F2E8" stroke="#2F7A55"/>
  <text x="250" y="202" font-size="15" font-weight="700" fill="#1F4D3A">The box (Docker) · Windows GPU, Mac, or Pi</text>

  <rect x="250" y="222" width="250" height="96" rx="8" fill="#FFFFFF" stroke="#2F7A55"/>
  <text x="268" y="250" font-size="15" font-weight="700" fill="#18281F">App</text>
  <text x="268" y="273" font-size="13" fill="#3E5247">FastAPI + mint map web UI</text>
  <text x="268" y="294" font-size="13" fill="#3E5247">retrieve → prompt → cite</text>

  <rect x="600" y="222" width="250" height="96" rx="8" fill="#FFFFFF" stroke="#2F7A55"/>
  <text x="618" y="250" font-size="15" font-weight="700" fill="#18281F">Ollama</text>
  <text x="618" y="273" font-size="13" fill="#3E5247">runs the open-weight model</text>
  <text x="618" y="294" font-size="13" fill="#3E5247">on GPU or CPU</text>

  <rect x="250" y="338" width="250" height="84" rx="8" fill="#FFFFFF" stroke="#2F7A55"/>
  <text x="268" y="366" font-size="15" font-weight="700" fill="#18281F">Knowledge pack</text>
  <text x="268" y="389" font-size="13" fill="#3E5247">Wikipedia chunks + embeddings</text>
  <text x="268" y="408" font-size="13" fill="#3E5247">saved on disk</text>

  <rect x="600" y="338" width="250" height="84" rx="8" fill="#FFFFFF" stroke="#2F7A55"/>
  <text x="618" y="366" font-size="15" font-weight="700" fill="#18281F">bench.py</text>
  <text x="618" y="389" font-size="13" fill="#3E5247">asks the app, per tier</text>
  <text x="618" y="408" font-size="13" fill="#3E5247">tokens/sec → results.csv</text>

  <!-- Phone -->
  <rect x="30" y="232" width="150" height="76" rx="10" fill="#1F4D3A"/>
  <text x="105" y="264" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Phone / laptop</text>
  <text x="105" y="287" font-size="13" fill="#CFE8D8" text-anchor="middle">same Wi-Fi, no internet</text>

  <!-- arrows -->
  <path d="M180 270H246" stroke="#1F4D3A" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M500 270H596" stroke="#1F4D3A" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M375 318V334" stroke="#1F4D3A" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M600 380H550V300H504" stroke="#1F4D3A" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M520 142V172" stroke="#E58A2E" stroke-width="1.6" fill="none" marker-end="url(#h)"/>
  <text x="530" y="164" font-size="12" fill="#8A4A0E">pull once</text>
</svg>
