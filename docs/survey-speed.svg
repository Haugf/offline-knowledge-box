<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" width="640" height="222" role="img" aria-labelledby="t d">
  <title id="t">Survey: seconds per photo</title>
  <desc id="d">SmolVLM2 2.2B on an RTX 3070. First photo, which loads the model: 16.6 seconds. Each photo after that: 1.6 seconds (median of 4).</desc>
  <rect width="640" height="222" rx="6" fill="#F4F1E6"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="24" y="36" font-size="17" font-weight="700" fill="#1E1E1E">Survey: seconds per photo</text>
    <text x="24" y="58" font-size="13" fill="#55524A">SmolVLM2 2.2B on an RTX 3070 · lower is better</text>
  </g>
  <g stroke="#D8CBB8" stroke-width="1">
    <line x1="170" y1="80" x2="170" y2="172"/><line x1="270" y1="80" x2="270" y2="172"/>
    <line x1="370" y1="80" x2="370" y2="172"/><line x1="470" y1="80" x2="470" y2="172"/>
    <line x1="570" y1="80" x2="570" y2="172"/>
  </g>
  <g font-family="Consolas, ui-monospace, monospace" font-size="11" fill="#55524A" text-anchor="middle">
    <text x="170" y="190">0</text><text x="270" y="190">5</text><text x="370" y="190">10</text>
    <text x="470" y="190">15</text><text x="570" y="190">20</text>
  </g>
  <text x="370" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#55524A" text-anchor="middle">seconds</text>
  <g fill="#2E7A45">
    <path d="M170 92 H498 Q502 92 502 96 V110 Q502 114 498 114 H170 Z"/>
    <path d="M170 136 H198 Q202 136 202 140 V154 Q202 158 198 158 H170 Z"/>
  </g>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1E1E1E">
    <text x="158" y="101" text-anchor="end" font-weight="600">First photo</text>
    <text x="158" y="117" text-anchor="end" font-size="11" fill="#55524A">loads the model</text>
    <text x="158" y="145" text-anchor="end" font-weight="600">Each photo after</text>
    <text x="158" y="161" text-anchor="end" font-size="11" fill="#55524A">median of 4</text>
    <text x="510" y="107.5">16.6 s</text>
    <text x="210" y="151.5">1.6 s</text>
